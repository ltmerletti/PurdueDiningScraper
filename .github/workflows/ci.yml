name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned dependencies and package
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Check CLI and MCP entry points
        run: |
          purdue-menu --help
          python -c "from purdue_menu.mcp.server import create_mcp_server; create_mcp_server()"
      - name: Run tests without network access
        run: python -m pytest --disable-socket --allow-unix-socket --junitxml=test-results/pytest.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-${{ matrix.python }}
          path: test-results/pytest.xml
          if-no-files-found: ignore
          retention-days: 7
